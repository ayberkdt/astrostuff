name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[verification,dev,plotting]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test (no network)
        run: python -m pytest -m "not network" --junitxml=test-report.xml
      - name: Report failed tests as annotations
        if: failure()
        run: python .github/annotate_failures.py test-report.xml
