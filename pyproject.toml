[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kozmos"
version = "0.2.0"
description = "Astronomy and astrophysics library in which every function cites its published source"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ayberk" }]
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
verification = ["astropy>=7", "pyerfa>=2.0.1"]
dev = ["pytest>=8", "hypothesis>=6", "ruff", "mypy"]
plotting = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "oracle: comparison against an independent library (astropy, erfa)",
    "network: requires network access",
    "slow: long-running test",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
# ruff format decides layout; E501 only fires on long strings that cannot be split (source notes).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bibliography/**" = ["E501"]
"projects/**" = ["E501"]
